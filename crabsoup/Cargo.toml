[package]
name = "crabsoup"
version = "0.1.0-alpha.5"
authors = ["Lymia Kanokawa <lymia@lymia.moe>"]
edition = "2021"

description = "A Rust re-implementation of soupault."

repository = "https://github.com/Lymia/crabsoup"
readme = "README.md"

license = "Apache-2.0"

[features]
default = ["binary"]
binary = ["clap"]

[dependencies]
base64 = "0.22.1"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
codespan-reporting = "0.13"
clap = { version = "4.5", features = ["derive"], optional = true }
encoding_rs = { version = "0.8.34", features = ["fast-legacy-encode"] }
html-escape = "0.2.13"
html5ever = "0.38"
minijinja = "2.1"
num_cpus = "1.16"
parking_lot = "0.12"
regex = "1.10"
rustyline = { version = "17.0", default-features = false }
tokio = { version = "1.39", features = ["io-util", "process", "rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tsugiki = "0.9.0-alpha.1"
typed-path = "0.12.0"
urlencoding = "2.1.3"
wyrand = { version = "0.3", features = ["wyhash"] }

# Codecs
csv = "1.3"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Cryptography
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
blake2 = "0.10"

# Low-usage crates
tidier = "=0.5.2"

# Workspace dependencies
anyhow.workspace = true
glob.workspace = true
mlua.workspace = true

# Internal libraries
crabsoup-mlua-analyze.workspace = true
serde = { version = "1.0.204", features = ["derive"] }

[build-dependencies]
anyhow = { workspace = true }
glob = { workspace = true }
mlua = { workspace = true }
crabsoup-mlua-analyze.workspace = true
